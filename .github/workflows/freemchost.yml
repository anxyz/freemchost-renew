name: Freemchost Auto Renew Permanent

on:
  schedule:
    - cron: '15 0,12 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 发送 Telegram 图文通知
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: freemchost-renew
  cancel-in-progress: false

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 安装固定版本依赖
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: 运行回归检查
        run: |
          npm run check
          npm test

      - name: 设置可选代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "未配置节点，按 PROXY_URL 或直连设置运行"
            exit 0
          fi
          if ! curl --fail --silent --location --retry 3 \
            https://main.ssss.nyc.mn/setup_proxy.sh \
            -o "$RUNNER_TEMP/freemchost_proxy.sh" >/dev/null 2>&1; then
            echo "::error::代理初始化脚本下载失败"
            exit 1
          fi
          for attempt in 1 2 3; do
            if python3 scripts/private_run.py --proxy-setup bash "$RUNNER_TEMP/freemchost_proxy.sh"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "代理初始化失败，5 秒后重试"
              sleep 5
            fi
          done
          echo "::error::代理初始化失败"
          exit 1

      - name: 执行自动续期
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL || env.PROXY_SERVER || '' }}
          SEND_TG: ${{ github.event_name != 'workflow_dispatch' || inputs.notify }}
        run: python3 scripts/private_run.py node renew.js

      - name: 清理代理
        if: always()
        run: |
          pkill -x sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log || true
